<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card {
            width: 500px;
            height: 600px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .container{
            padding: 2px 16px;
            color: white;
        }
    </style>
</head>
<body style = 'background-color: black;'>
    <div class = "card">
        <img src="img_avatar.png" alt="Avatar" width="40%">
        <div class="container">
            <h4>Satyam Kumar</h4>
            <p>Engineer</p>
        </div>
    </div>
</body>

<script>

    let data;
    const reqURL = 'https://api.github.com/users/hiteshchoudhary';
    const xhr = new XMLHttpRequest();
    xhr.open('GET', reqURL);

    xhr.onreadystatechange = function () {
        console.log(xhr.readyState);
        if(xhr.readyState === 4) {
            data = JSON.parse(this.responseText);
            console.log(typeof data);
            console.log(data.followers);

            document.querySelector('.card img').setAttribute('src', `${data.avatar_url}`);
            document.querySelector('h4').innerHTML = `${data.name}`;
        }
    }

    xhr.send();
</script>
</html>
